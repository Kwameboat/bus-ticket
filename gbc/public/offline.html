<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A56DB">
    <title>Offline — GhanaBus Connect</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f8fafc; color:#1e293b; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:#fff; border-radius:24px; padding:48px 32px; text-align:center; max-width:360px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
        .icon { font-size:64px; margin-bottom:16px; }
        h1 { font-size:24px; font-weight:800; margin-bottom:8px; color:#1e293b; }
        p { color:#64748b; font-size:15px; line-height:1.6; margin-bottom:24px; }
        .btn { display:inline-block; background:#1A56DB; color:#fff; font-weight:700; padding:12px 28px; border-radius:14px; text-decoration:none; font-size:15px; border:none; cursor:pointer; }
        .btn:hover { background:#1d4ed8; }
        .hint { font-size:12px; color:#94a3b8; margin-top:20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📵</div>
        <h1>You're offline</h1>
        <p>GhanaBus Connect needs an internet connection to search for buses and process bookings. Please check your connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <p class="hint">Your saved bookings are still viewable in the app once you're back online.</p>
    </div>
</body>
</html>
